<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livia Li | The UX stories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&family=La+Belle+Aurore&family=Space+Mono&family=Caveat:wght@400..700&family=EB+Garamond:ital,wght@0,300;1,300&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <style>
        :root {
            --royal-violet: #3E173A;
            --aged-parchment: #dfc9a5;   
            --cinema-white: #f8f8f8;    
            --cinema-void: #050505;     
            --shimmer-bronze: #C09304;   
            --blood-ink: #8A0303;      
            --ornament-dot: #6C1708;
            --lush-blue: #065F82;    
            --crimson-red: #A64522; /* 锁定：手动修改的橙红色 */

            /* Warmth 洇染配色 */
            --warmth-bg: #F7EEE9;
            --orange: #D34A00;      
            --orange-deep: #E64322; 
            --peach: #F1948A;
        }

        * { scroll-behavior: smooth; cursor: none; }
        @media (max-width: 768px) { * { cursor: auto !important; } #cursor { display: none !important; } }

        body {
            background-color: var(--royal-violet);
            color: var(--aged-parchment);
            font-family: 'Cormorant Garamond', serif;
            overflow: hidden;
            margin: 0;
            touch-action: manipulation;
        }

        /* --- 最终锁定的“小太阳”光标样式 --- */
        #cursor {
            width: 6px; height: 6px;
            background: var(--shimmer-bronze); /* 中心黄色核心 */
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            /* 统一的多层深橙色柔和渐变晕染 */
            box-shadow: 
                0 0 6px 2.5px var(--crimson-red),      /* 核心加深层 */
                0 0 20px 5px rgba(166, 69, 34, 0.9),    /* 中间增强层 */
                0 0 35px rgba(166, 69, 34, 0.4);        /* 边缘扩散层 */
            transition: transform 0.1s ease-out, box-shadow 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%); 
        }

        .view { position: fixed; inset: 0; display: none; z-index: 10; }
        .view.active { display: block; }

        /* --- Archive View --- */
        .book-wrapper {
            perspective: 2500px; display: flex; align-items: center; justify-content: center;
            min-height: 100vh; position: relative; padding: 20px; z-index: 20; transition: opacity 0.5s ease;
        }
        .mystic-field { position: absolute; top: 50%; left: 50%; width: 0; height: 0; z-index: 5; pointer-events: none; transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1); }
        .mystic-symbol { position: absolute; top: 0; left: 0; opacity: 0; animation: riverFlow var(--dur) infinite ease-in-out; white-space: nowrap; }
        @keyframes riverFlow {
            0% { transform: translate(0, 0) scale(0.1); opacity: 0; }
            10% { opacity: 0.85; transform: translate(calc(var(--tx) * 0.12), calc(var(--ty) * 0.12)) scale(0.4); }
            100% { transform: translate(var(--tx), calc(var(--ty) + var(--hookY))) scale(var(--s)); opacity: 0; }
        }
        .book { width: 380px; height: 520px; position: relative; transform-style: preserve-3d; transition: transform 1.6s cubic-bezier(0.4, 0, 0.2, 1); }
        @media (min-width: 769px) { .book.open { transform: translateX(190px); } }
        .book-page-flip { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: left; transition: transform 1.8s cubic-bezier(0.6, 0, 0.4, 1); z-index: 10; }
        .book.open .book-page-flip { transform: rotateY(-180deg); }
        .book-cover-front { position: absolute; inset: 0; background: #2a1028; background-image: url("https://www.transparenttextures.com/patterns/leather.png"); border-radius: 4px 10px 10px 4px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; }
        .dot-ornament { width: 14px; height: 14px; background-color: var(--ornament-dot); border-radius: 50%; box-shadow: inset 0 1px 2px rgba(0,0,0,0.4), 0 1px 1px rgba(255,255,255,0.05); }
        .book-inside-right { position: absolute; inset: 0; background: var(--aged-parchment); background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png"); padding: 4rem 2.5rem; color: #1a0b26; border-radius: 0 10px 10px 0; z-index: 5; display: flex; flex-direction: column; overflow: hidden; }
        .book-back-cover { position: absolute; inset: 0; background: var(--aged-parchment); background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png"); padding: 4rem 2.5rem; color: #1a0b26; border-radius: 10px 0 0 10px; transform: rotateY(180deg); backface-visibility: hidden; }

        .scrambled-container { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; line-height: 1.8; cursor: pointer; word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap; width: 100%; }
        .word-node { display: inline-block; }
        .interactive-word { font-weight: 700; text-decoration: underline !important; text-decoration-thickness: 2px !important; text-underline-offset: 8px; display: inline-block; padding: 0 0.1rem; transition: filter 0.3s ease; }
        .word-data { color: var(--lush-blue); }
        .word-warmth { color: var(--crimson-red); }
        .interactive-word:hover { filter: brightness(1.2); }
        
        /* 锁定：Desktop 签名与触发词大小 2.5rem */
        .doodle-trigger { font-family: 'La Belle Aurore', cursive; font-size: 2.5rem; color: var(--blood-ink); opacity: 0.85; margin-top: auto; margin-bottom: 6.5rem; cursor: pointer; transition: 0.3s ease; width: fit-content; }
        .doodle-trigger:hover { opacity: 1; transform: scale(1.05); }

        /* --- Warmth Watercolor Bloom Transition --- */
        #fx-stage { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
        .watercolor-bloom {
            position: absolute; width: 450px; height: 450px;
            background: radial-gradient(circle at center, #FFFFFF 0%, var(--warmth-bg) 10%, var(--orange) 35%, var(--orange-deep) 60%, var(--peach) 85%, transparent 100%);
            border-radius: 50%; filter: url(#liquid-filter) blur(75px); opacity: 0; transform: translate(-50%, -50%) scale(0);
        }
        .watercolor-bloom.active { animation: orangeSoak 3s cubic-bezier(0.7, 0, 0.2, 1) forwards; }
        @keyframes orangeSoak {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
            12% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(80) rotate(8deg); opacity: 1; }
        }
        #final-wash { position: fixed; inset: 0; background: var(--warmth-bg); z-index: 300; opacity: 0; pointer-events: none; transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1); }
        #final-wash.active { opacity: 1; }

        /* --- Film View (Data) --- */
        #view-data { background: var(--cinema-void); overflow: hidden; }
        .film-texture { position: absolute; inset: 0; background-image: url("https://www.transparenttextures.com/patterns/stardust.png"); opacity: 0.12; pointer-events: none; z-index: 50; transition: opacity 1s ease; }
        #film-strip { position: relative; width: 100vw; height: 100vh; transition: transform 4.5s cubic-bezier(0.85, 0, 0.15, 1); transform-style: preserve-3d; }
        .film-container { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; z-index: 10; }
        #void-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .ornate-film-frame { position: absolute; inset: 6vw; pointer-events: none; opacity: 0; transition: opacity 1.5s ease; filter: url(#jitter); display: flex; align-items: center; justify-content: center; }
        @media (min-width: 768px){ .ornate-film-frame { inset: 12.5vh 8vw; transform: scaleX(0.9); } } /* 保持 75vh 边框逻辑 */
        .ornate-film-frame.visible { opacity: 1; }
        .frame-inner-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .silent-text-content { position: relative; max-width: 800px; width: 80%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--cinema-white); opacity: 0; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); z-index: 20; height: auto; }
        .silent-text-content.active { opacity: 1; }
        .film-dialogue { font-size: 2.5rem; line-height: 1.6; font-style: italic; display: block; }
        .drop-cap { font-size: 5.5rem; line-height: 0.6; font-weight: 600; font-style: normal; display: inline-block; }
        .grungy-btn { background: transparent; border: 1.5px solid var(--cinema-white); color: var(--cinema-white); padding: 1rem 2.5rem; font-family: 'Space Mono', monospace; font-size: 0.85rem; letter-spacing: 0.5em; text-transform: uppercase; cursor: pointer; border-radius: 100px; white-space: nowrap; filter: url(#jitter); }
        .grungy-btn:hover { background: var(--cinema-white); color: var(--cinema-void); }
        #investigate-trigger { display: block; opacity: 0; max-height: 0; overflow: hidden; transform: translateY(20px); transition: 1.4s cubic-bezier(0.4, 0, 0.2, 1); margin-top: 0; pointer-events: none; }
        #investigate-trigger.visible { max-height: 200px; opacity: 1; transform: translateY(0); margin-top: 3rem; pointer-events: auto; }

        /* Film Reel Effects */
        .reel-flicker-overlay { position: fixed; inset: 0; background: white; z-index: 1000; pointer-events: none; opacity: 0; }
        .spinning .reel-flicker-overlay { animation: projectorShutter 0.08s infinite steps(2); }
        @keyframes projectorShutter { 0% { opacity: 0; } 100% { opacity: 0.08; } }
        .fuzz-frame { height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; background: var(--cinema-void); position: relative; overflow: hidden; }
        .fuzz-content { width: 100%; height: 100%; background-image: url("https://www.transparenttextures.com/patterns/stardust.png"); opacity: 0.3; animation: fuzzShake 0.1s infinite steps(2); }
        @keyframes fuzzShake { 0% { transform: translate(10px, -5px) scale(1.1); } 50% { transform: translate(-5px, 10px) scale(1.2); } 100% { transform: translate(0,0) scale(1.1); } }

        @media (max-width: 768px) {
            .book { width: 280px; height: 400px; }
            .book.open { transform: translateY(0); }
            .book-inside-right { padding: 3rem 1.5rem; }
            .scrambled-container { font-size: 1.4rem; line-height: 1.9; } 
            .doodle-trigger { font-size: 1.85rem; margin-top: 2rem; margin-bottom: 2rem; }
            .ornate-film-frame { inset: 12.5vh 6vw; } /* 锁定：75vh */
            .film-dialogue { font-size: 2rem; }
            .drop-cap { font-size: 3rem; }
            .silent-text-content { width: 75%; } 
            #investigate-trigger.visible { margin-top: 2rem; }
        }

        #transition-overlay { position: fixed; inset: 0; z-index: 999; pointer-events: none; opacity: 0; background: var(--cinema-void); transition: opacity 0.5s ease; }
        #transition-overlay.active { opacity: 1; pointer-events: auto; }
        #data-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
        .hand { font-family: 'Caveat', cursive; font-weight: 300; } 
        .mono { font-family: 'Space Mono', monospace; font-size: 0.55rem; letter-spacing: 0.4em; text-transform: uppercase; }
        .paper-grain { position: fixed; inset: 0; pointer-events: none; opacity: 0.04; mix-blend-mode: multiply; background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png"); z-index: 1000; }
    </style>
</head>
<body id="body-main">
    <svg width="0" height="0" style="position: absolute;">
        <filter id="liquid-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="40" />
            <feDisplacementMap in="SourceGraphic" scale="120" />
        </filter>
        <filter id="jitter">
            <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" />
        </filter>
    </svg>

    <div id="cursor"></div>
    <div class="reel-flicker-overlay"></div>
    <div id="transition-overlay"><canvas id="data-canvas"></canvas></div>
    <div class="paper-grain"></div>

    <!-- Warmth Bloom Stage -->
    <div id="fx-stage">
        <div id="fx-bloom" class="watercolor-bloom"></div>
    </div>
    <div id="final-wash"></div>

    <!-- VIEW: Archive -->
    <section class="view active" id="view-archive">
        <div class="mystic-field" id="mystic-field"></div>
        <div class="book-wrapper" id="book-archive-wrapper">
            <div class="book" id="grimoire">
                <div class="book-page-flip">
                    <div class="book-cover-front"><div class="dot-ornament"></div></div>
                    <div class="book-back-cover">
                        <div class="hidden md:block">
                            <p class="mono opacity-40">ENTRY.01</p>
                            <div style="font-style: italic;" class="text-2xl mt-12">If found, please return to:</div>
                            <!-- 锁定：Desktop 签名 2.5rem -->
                            <div class="hand text-[2.5rem] mt-6 opacity-85" style="color: #1a0b26;">Livia Li</div>
                        </div>
                    </div>
                </div>
                <div class="book-inside-right">
                    <p class="mono mb-11 opacity-40">SPRING.2026</p>
                    <div class="scrambled-container" id="scrambled-game"></div>
                    <div class="doodle-trigger" id="doodle-resolve">Piercing?</div>
                </div>
            </div>
        </div>
    </section>

    <!-- VIEW: Warmth Placeholder -->
    <section class="view" id="view-warmth"></section>

    <!-- VIEW: Data (Film Strip) -->
    <section class="view" id="view-data">
        <div class="film-texture"></div>
        <div id="film-strip">
            <div class="film-container">
                <div class="ornate-film-frame" id="intertitle-frame">
                    <svg class="frame-inner-svg" viewBox="0 0 1000 600" preserveAspectRatio="none">
                        <path d="M50,10 L950,10 L950,50 L990,50 L990,550 L950,550 L950,590 L50,590 L50,550 L10,550 L10,50 L50,50 Z" fill="none" stroke="rgba(248,248,248,0.7)" stroke-width="2" />
                    </svg>
                </div>
                <div id="void-state">
                    <button class="grungy-btn" onclick="startFilmFlow()">Where am I?</button>
                </div>
                <div id="film-text-area" class="silent-text-content">
                    <div id="dialogue-display" class="w-full"></div>
                    <div id="investigate-trigger">
                        <button class="grungy-btn" onclick="revealCaseStudy()">Investigate</button>
                    </div>
                </div>
            </div>
            <div class="fuzz-frame"><div class="fuzz-content"></div></div>
            <div class="fuzz-frame"><div class="fuzz-content" style="transform: rotate(180deg);"></div></div>
            <div class="fuzz-frame"><div class="fuzz-content"></div></div>
            <div class="film-container bg-black"></div>
        </div>
    </section>

    <script>
        const cursor = document.getElementById('cursor');
        const book = document.getElementById('grimoire');
        const container = document.getElementById('scrambled-game');
        const doodleResolve = document.getElementById('doodle-resolve');
        const mysticField = document.getElementById('mystic-field');
        const overlay = document.getElementById('transition-overlay');
        const dataCanvas = document.getElementById('data-canvas');
        const strip = document.getElementById('film-strip');
        
        const bloom = document.getElementById('fx-bloom');
        const wash = document.getElementById('final-wash');
        
        const targetSentence = "Piercing through data to infuse systematic warmth";
        let isResolved = false;
        let scrambleInterval = null;
        const isMobile = window.innerWidth <= 768;

        /* --- 锁定版光标跟随 (全局统一“太阳”效果) --- */
        if(!isMobile) {
            document.addEventListener('mousemove', (e) => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });
        }

        const symbols = ['✿', '❀', '❁', '✾', '❊', '❃', '✻', '❋', '★', '♩', '♪', '♫', '♬'];
        for(let i=0; i<(isMobile ? 120 : 250); i++) {
            const s = document.createElement('div');
            s.className = 'mystic-symbol';
            s.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            const isTR = Math.random() > 0.5;
            let tx = isTR ? 800 + Math.random() * 1200 : -800 - Math.random() * 1200;
            let ty = isTR ? -800 - Math.random() * 1200 : 800 + Math.random() * 1200;
            s.style.setProperty('--tx', `${tx}px`); s.style.setProperty('--ty', `${ty}px`);
            s.style.setProperty('--hookY', (ty < 0 ? 300 : -300) + 'px');
            if (isMobile) s.style.setProperty('--s', 1.8 + Math.random() * 3); 
            else s.style.setProperty('--s', isTR ? 1.3 + Math.random() * 2.7 : 2.5 + Math.random() * 3.5);
            s.style.setProperty('--dur', `${140 + Math.random() * 140}s`);
            s.style.color = ['#026AAC', '#C09304', '#BF3F29', '#D43890'][Math.floor(Math.random()*4)];
            s.style.animationDelay = -(Math.random() * 200) + 's';
            s.style.fontSize = isMobile ? '35px' : '32px'; 
            mysticField.appendChild(s);
        }

        function getShuffledChars() {
            const arr = targetSentence.split('');
            const first = arr[0]; const rest = arr.slice(1);
            for (let i = rest.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [rest[i], rest[j]] = [rest[j], rest[i]];
            }
            return [first, ...rest];
        }

        function createSlots() {
            container.innerHTML = '';
            getShuffledChars().forEach(char => {
                const span = document.createElement('span');
                span.textContent = char === ' ' ? '\u00A0' : char;
                span.className = 'char-slot';
                container.appendChild(span);
            });
        }
        createSlots();

        function scramble() {
            if (isResolved) return;
            const slots = container.querySelectorAll('.char-slot');
            const shuffled = getShuffledChars();
            slots.forEach((slot, i) => { if (slot && shuffled[i]) slot.textContent = shuffled[i] === ' ' ? '\u00A0' : shuffled[i]; });
        }

        if(!isMobile) {
            container.addEventListener('mouseenter', () => { if(!isResolved && !scrambleInterval) scrambleInterval = setInterval(scramble, 80); });
            container.addEventListener('mouseleave', () => { clearInterval(scrambleInterval); scrambleInterval = null; });
        } else {
            setInterval(() => { if(!isResolved && book.classList.contains('open')) scramble(); }, 120);
        }

        async function triggerRevealSequence() {
            isResolved = true; clearInterval(scrambleInterval);
            const words = targetSentence.split(' ');
            container.innerHTML = '';
            words.forEach((word, wordIdx) => {
                const wordNode = document.createElement('span');
                wordNode.className = 'word-node';
                const lower = word.toLowerCase();
                if (lower.includes('data') || lower.includes('warmth')) {
                    wordNode.classList.add('interactive-word', lower.includes('data') ? 'word-data' : 'word-warmth');
                    wordNode.onclick = (e) => { e.stopPropagation(); lower.includes('data') ? runDataTransition() : runWarmthTransition(e); };
                }
                word.split('').forEach(c => {
                    const s = document.createElement('span'); s.textContent = c; s.style.opacity = '0'; s.style.transition = 'opacity 0.4s';
                    wordNode.appendChild(s); setTimeout(() => s.style.opacity = '1', 500 + wordIdx * 100);
                });
                container.appendChild(wordNode);
                if (wordIdx < words.length - 1) container.appendChild(document.createTextNode('\u00A0'));
            });
            doodleResolve.style.display = 'none';
        }

        doodleResolve.onclick = (e) => { e.stopPropagation(); triggerRevealSequence(); };

        function switchView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            overlay.classList.remove('active');
            dataCanvas.style.display = 'none';
        }

        function runWarmthTransition(e) {
            const x = e.clientX || window.innerWidth / 2;
            const y = e.clientY || window.innerHeight / 2;
            document.getElementById('book-archive-wrapper').style.opacity = '0';
            document.body.style.backgroundColor = 'var(--warmth-bg)';
            bloom.style.left = `${x}px`; bloom.style.top = `${y}px`;
            bloom.classList.add('active');
            setTimeout(() => { wash.classList.add('active'); }, 2100);
            setTimeout(() => { window.location.href = 'warmth.html'; }, 2500);
        }

        function startFilmFlow() {
            document.getElementById('void-state').style.display = 'none';
            const frame = document.getElementById('intertitle-frame');
            const textArea = document.getElementById('film-text-area');
            const display = document.getElementById('dialogue-display');
            const trigger = document.getElementById('investigate-trigger');
            frame.classList.add('visible');
            setTimeout(() => {
                display.innerHTML = '<span class="film-dialogue"><span class="drop-cap">W</span>here fog lives ... where a killer walks.</span>';
                textArea.classList.add('active');
                setTimeout(() => {
                    textArea.classList.remove('active');
                    setTimeout(() => {
                        display.innerHTML = '<span class="film-dialogue"><span class="drop-cap">T</span>hat name... never speak it.&nbsp;Eligibility.</span>';
                        textArea.classList.add('active');
                        setTimeout(() => trigger.classList.add('visible'), 2000); 
                    }, 800); 
                }, 2000); 
            }, 800);
        }

        function revealCaseStudy() {
            document.getElementById('body-main').classList.add('spinning');
            strip.style.transition = 'transform 3s cubic-bezier(0.85, 0, 0.15, 1)'; 
            strip.style.transform = 'translateY(-400vh)';
            setTimeout(() => { window.location.href = 'data.html'; }, 3000); 
        }

        function runDataTransition() {
            overlay.classList.add('active');
            dataCanvas.style.display = 'block';
            const ctx = dataCanvas.getContext('2d');
            const w = dataCanvas.width = window.innerWidth;
            const h = dataCanvas.height = window.innerHeight;
            const count = isMobile ? 110 : 200; 
            const particles = [];
            for(let i=0; i<count; i++) {
                particles.push({
                    angleOffset: i * 0.1375, baseSize: 18 + Math.random() * 30, char: "0123456789"[Math.floor(Math.random() * 10)],
                    colorBase: Math.random() > 0.4 ? [192, 214, 223] : [6, 95, 130], life: Math.random() 
                });
            }
            const startTime = performance.now();
            const duration = 3000;
            function draw() {
                const now = performance.now();
                const progress = now - startTime;
                const ratio = progress / duration;
                ctx.fillStyle = `rgba(5, 5, 5, ${0.4 + (ratio * 0.5)})`; ctx.fillRect(0, 0, w, h);
                const worldSpin = progress * (0.0007 + ratio * 0.005);
                const lensWobbleX = Math.sin(progress * 0.0008) * (w * 0.04) * (1 - ratio);
                const lensWobbleY = Math.cos(performance.now() * 0.0008) * (h * 0.04) * (1 - ratio);
                particles.forEach((p) => {
                    p.life += 0.006 * (1 + ratio * 0.8); if (p.life > 1) p.life = 0;
                    const centrifugalVelocity = Math.pow(p.life, 1.7) * (Math.max(w,h) * 2.1);
                    const currentAngle = p.angleOffset + worldSpin;
                    const x = (w/2 + lensWobbleX) + Math.cos(currentAngle) * centrifugalVelocity;
                    const y = (h/2 + lensWobbleY) + Math.sin(currentAngle) * centrifugalVelocity;
                    const fade = Math.max(0, 1 - centrifugalVelocity / (Math.max(w,h) * 1.8)) * (1 - ratio);
                    ctx.save(); ctx.translate(x, y); ctx.rotate(currentAngle + Math.PI/2);
                    ctx.fillStyle = `rgb(${p.colorBase[0]}, ${p.colorBase[1]}, ${p.colorBase[2]})`;
                    ctx.globalAlpha = 0.2 + fade * 0.8;
                    ctx.font = `bold ${p.baseSize * (0.2 + Math.pow(p.life, 1.5) * 8)}px Space Mono`;
                    ctx.fillText(p.char, 0, 0); ctx.restore();
                });
                if (progress < duration) requestAnimationFrame(draw);
                else { ctx.fillStyle = "#050505"; ctx.fillRect(0, 0, w, h); setTimeout(() => switchView('view-data'), 100); }
            }
            draw();
        }

        book.onclick = (e) => { 
            if(!e.target.closest('.interactive-word') && e.target.id!=='doodle-resolve') { 
                book.classList.toggle('open'); 
                mysticField.style.opacity = book.classList.contains('open') ? '0' : '1'; 
            } 
        };

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('state') === 'resolved') {
                const pageFlip = document.querySelector('.book-page-flip');
                const swiftEase = 'transform 1.9s cubic-bezier(0.3, 0, 0.2, 1)';
                grimoire.style.transition = swiftEase;
                if(pageFlip) pageFlip.style.transition = swiftEase;
                mysticField.style.transition = 'opacity 1.5s ease-out';
                isResolved = true; clearInterval(scrambleInterval);
                const words = targetSentence.split(' ');
                container.innerHTML = ''; 
                words.forEach((word, wordIdx) => {
                    const wordNode = document.createElement('span'); wordNode.className = 'word-node';
                    const lower = word.toLowerCase();
                    if (lower.includes('data') || lower.includes('warmth')) {
                        wordNode.classList.add('interactive-word', lower.includes('data') ? 'word-data' : 'word-warmth');
                        wordNode.onclick = (e) => { e.stopPropagation(); lower.includes('data') ? runDataTransition() : runWarmthTransition(e); };
                    }
                    word.split('').forEach(c => {
                        const s = document.createElement('span'); s.textContent = c; s.style.opacity = '1'; wordNode.appendChild(s);
                    });
                    container.appendChild(wordNode);
                    if (wordIdx < words.length - 1) container.appendChild(document.createTextNode('\u00A0'));
                });
                doodleResolve.style.display = 'none'; 
                setTimeout(() => {
                    grimoire.classList.add('open'); mysticField.style.opacity = '0';
                }, 300); 
            }
        });
    </script>
</body>
</html>
