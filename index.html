<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Livia Li's UX Tales</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=IM+Fell+English:ital@0;1&family=IM+Fell+DW+Pica:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #08040a; 
    --bg-2: #120814;
    --ember: #e8b450;
    --ember-bright: #f5d180;
    --ink: #f0e2bc;
    --dim: 0.45;
    
    /* Warmth Palette */
    --warmth-bg: #F7EEE9;
    --orange: #e67e22;
    --orange-deep: #d35400;
    --peach: #ffb38a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IM Fell English', serif;
    overflow: hidden;
    cursor: default;
    font-size: 16px;
    transition: background-color 0.5s ease;
  }

  .stage {
    position: fixed; inset: 0;
    overflow: hidden;
    background: var(--bg);
    transition: background 0.8s ease;
  }
  .stage::before {
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.85  0 0 0 0 0.65  0 0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.05'/></svg>");
    opacity: 0.05; mix-blend-mode: overlay; z-index: 30;
    transition: opacity 0.5s ease;
  }
  .stage::after {
    content:""; position:absolute; inset:0; pointer-events:none; z-index: 31;
    background: radial-gradient(ellipse 95% 80% at 50% 50%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.6) 100%);
    transition: opacity 0.5s ease;
  }

  /* Transition modifiers */
  .stage.warm-transition { background: var(--warmth-bg); }
  .stage.warm-transition::before, .stage.warm-transition::after { opacity: 0; }

  #book-archive-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    z-index: 40;
    transition: opacity 0.8s ease;
  }

  header.title {
    position: absolute;
    top: clamp(60px, 10vh, 100px); 
    left: 0; right: 0;
    text-align: center;
    z-index: 40;
    pointer-events: none;
    padding: 0 24px;
  }
  h1.tales {
    font-family: 'IM Fell English', 'Cinzel', serif;
    font-weight: 400; 
    font-size: clamp(32px, 5vw, 64px);
    letter-spacing: 0.05em;
    color: var(--ember-bright);
    filter: drop-shadow(0 0 15px rgba(232,180,80,0.2));
    animation: emberFlicker 6s ease-in-out infinite;
  }
  .tagline {
    margin-top: 12px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; 
    color: rgba(240,226,188,0.8);
    letter-spacing: 0.04em;
    line-height: 1.2;
    max-width: 95vw;
    margin-left: auto;
    margin-right: auto;
    white-space: nowrap;
  }

  @keyframes emberFlicker {
    0%, 100% { filter: drop-shadow(0 0 12px rgba(232,180,80,0.15)); }
    50% { filter: drop-shadow(0 0 18px rgba(232,180,80,0.25)); }
  }

  #summary-display {
    position: absolute;
    top: clamp(190px, 28vh, 340px); 
    left: 50%;
    transform: translateX(-50%);
    width: clamp(320px, 90vw, 900px);
    text-align: left; 
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.6s cubic-bezier(.2,.8,.2,1);
  }
  #summary-display.active {
    opacity: 1;
    transform: translateX(-50%) translateY(-2px);
  }

  .summary-connector {
    position: absolute;
    top: 6px; 
    left: var(--connector-x, 0);
    width: 1px;
    height: calc(100% + 4px); 
    background: linear-gradient(to bottom, transparent 0%, var(--ember) 20%, var(--ember) 80%, transparent 100%);
    opacity: 0.45;
    transition: left 0.6s cubic-bezier(.2,.8,.2,1);
  }

  .summary-content {
    padding-left: 20px; 
    padding-top: 4px;
    margin-left: var(--connector-x, 0);
    transition: margin-left 0.6s cubic-bezier(.2,.8,.2,1);
    max-width: 650px; 
  }

  .summary-fact {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 18px;
    color: rgba(232, 180, 80, 0.8);
    margin-bottom: 4px;
  }
  .summary-text {
    font-family: 'Hanken Grotesk', sans-serif;
    font-weight: 300;
    font-size: 16px;
    line-height: 1.3;
    color: rgba(240, 226, 188, 0.9);
    white-space: nowrap; 
  }

  .shelf-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding-top: clamp(225px, 31vh, 390px);
    background: radial-gradient(ellipse at 50% 65%, rgba(232, 180, 80, 0.05) 0%, transparent 50%);
  }
  .shelf {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(12px, 3.5vw, 45px);
    padding: 0 clamp(12px, 2vw, 30px);
  }

  .book {
    position: relative;
    width: clamp(65px, 10vw, 115px); 
    height: clamp(285px, 50vh, 440px); 
    text-decoration: none;
    color: inherit;
    transform-origin: bottom center;
    transition: transform 850ms cubic-bezier(.2,.8,.2,1);
    -webkit-tap-highlight-color: transparent;
  }

  .spine {
    position: relative; z-index: 3;
    width: 100%; height: 100%;
    border-radius: 2px; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
    filter: brightness(var(--dim)) saturate(0.75);
    transition: filter 600ms ease;
  }
  .spine::before {
    content:""; position: absolute; inset: 0;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 22%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 100%);
  }

  .shelf:hover .book .spine { filter: brightness(1.0) saturate(1.05); }
  .book:hover .spine { filter: brightness(1.18) saturate(1.15); }
  .book:hover { transform: translateY(-15px); z-index: 5; }

  .book.blue .spine    { background: linear-gradient(180deg, #345990 0%, #102145 100%); }
  .book.red .spine     { background: linear-gradient(180deg, #9c3030 0%, #350c0c 100%); }
  .book.purple .spine  { background: linear-gradient(180deg, #6c3a96 0%, #200d3a 100%); }

  .rule {
    position: absolute; left: 15%; right: 15%; height: 1px;
    background: var(--ember); opacity: 0.12;
  }
  .rule.t1 { top: 7%; } .rule.t2 { top: 9.5%; }
  .rule.b1 { bottom: 7%; } .rule.b2 { bottom: 9.5%; }
  .rule.mid { top: 28%; }

  .emblem {
    position: absolute; 
    left: 50%; top: 16%; 
    transform: translate(-50%, 0);
    width: 32%; aspect-ratio: 1/1;
    color: var(--ember-bright); 
    opacity: 0.25;
    pointer-events: none;
  }
  .emblem svg { width: 100%; height: 100%; }

  .explore-btn {
    position: absolute;
    top: 54%; 
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    width: 80%;
  }

  .explore-label {
    font-family: 'Hanken Grotesk', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--ember-bright);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    border: 1px solid rgba(245, 209, 128, 0.3);
    padding: 6px 12px;
    min-width: 44px;
    border-radius: 20px;
    background: rgba(0,0,0,0.2);
    display: inline-flex;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  /* Specifically for the "Coming soon" state without the box styling and without bold weight */
  .explore-label.plain {
    border: none;
    background: none;
    padding: 0;
    white-space: normal;
    width: 130%;
    line-height: 1.3;
    font-weight: 400;
    font-size: 12px;
  }

  .book:hover .explore-label { opacity: 0.9; transform: translateY(0); }

  .name {
    position: absolute; 
    left: 50%; top: 40%; width: 95%;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif; 
    font-weight: 500;
    font-size: clamp(16px, 1.8vw, 20px); 
    color: #fff;
    text-shadow: 0 0 12px rgba(232,180,80,0.5);
    text-align: center;
    line-height: 1.1;
  }

  .particles {
    position: absolute; inset: 0; z-index: 1;
    pointer-events: none;
  }
  .spark.dot {
    position: absolute; left: 50%; top: 50%;
    width: 2px; height: 2px; border-radius: 50%;
    background: var(--ember-bright);
    opacity: 0.8;
    animation: scatter var(--dur, 9s) ease-out infinite;
    animation-delay: var(--delay);
  }

  @keyframes scatter {
    0%   { opacity: 0.8; transform: translate(-50%, -50%) scale(0.2); }
    85%  { opacity: 0.8; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.1); }
  }

  /* --- Transitions --- */
  
  #data-overlay {
    position: fixed; inset: 0; background: #050505; z-index: 1000;
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
  }
  #data-overlay.active { opacity: 1; pointer-events: all; }
  #data-canvas {
    position: fixed; inset: 0; z-index: 1001; display: none; pointer-events: none;
  }

  #fx-stage { position: fixed; inset: 0; z-index: 1000; pointer-events: none; }
  .watercolor-bloom {
    position: absolute;
    width: 450px;
    height: 450px;
    background: radial-gradient(circle at center, 
        #FFFFFF 0%, 
        var(--warmth-bg) 10%, 
        var(--orange) 35%, 
        var(--orange-deep) 60%, 
        var(--peach) 85%, 
        transparent 100%);
    border-radius: 50%;
    filter: url(#liquid-filter) blur(75px); 
    opacity: 0;
    transform: translate(-50%, -50%) scale(0);
  }
  .watercolor-bloom.active {
    animation: orangeSoak 3s cubic-bezier(0.7, 0, 0.2, 1) forwards;
  }
  @keyframes orangeSoak {
    0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
    12% { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(80) rotate(8deg); opacity: 1; }
  }
  #final-wash { 
    position: fixed; inset: 0; background: var(--warmth-bg); z-index: 1001; 
    opacity: 0; pointer-events: none; transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1); 
  }
  #final-wash.active { opacity: 1; pointer-events: all; }

  /* Desktop Adjustments Only */
  @media (min-width: 1025px) {
    .explore-btn { top: 56%; }
    .book:hover { transform: translateY(-20px); }
  }

  @media (max-width: 1024px) and (min-width: 721px) {
    .tagline { white-space: normal; max-width: 600px; }
  }

  /* Mobile Viewport */
  @media (max-width: 720px) {
    header.title { top: clamp(40px, 8vh, 70px); }
    h1.tales { font-size: clamp(32px, 9vw, 44px); }
    .tagline { 
      font-size: 18px; 
      margin-top: 6px; 
      white-space: normal; 
      max-width: 85vw;
    }
    #summary-display { top: clamp(160px, 28vh, 230px); width: 92vw; }
    .summary-content { padding-left: 14px; max-width: calc(92vw - 20px); }
    .summary-text { font-size: 15px; white-space: normal; }
    .shelf-wrap { padding-top: clamp(220px, 36vh, 340px); }
    .book { width: clamp(65px, 22vw, 85px); height: clamp(220px, 42vh, 330px); }
    .book:hover { transform: translateY(-10px); }
    .name { font-size: 16px; width: 95%; }
    .explore-btn { top: 60%; } 
  }
</style>
</head>
<body>

<div class="stage" id="main-stage">
  <div id="book-archive-wrapper">
    <header class="title">
      <h1 class="tales">Livia Li's UX Tales</h1>
      <p class="tagline">Pinpointing hidden gaps behind complex journeys and bringing clear, valuable direction to high-stakes teams.</p>
    </header>

    <div id="summary-display">
      <div class="summary-connector" id="sum-connector"></div>
      <div class="summary-content" id="sum-content">
        <div class="summary-fact" id="sum-fact"></div>
        <div class="summary-text" id="sum-text"></div>
      </div>
    </div>

    <main class="shelf-wrap">
      <nav class="shelf" id="main-shelf">
        <a class="book blue" href="#" data-url="/data-case"
           data-fact="Mobile, 2 weeks, +2% total conversations"
           data-text="Reframing killer questions to guided paths">
          <div class="particles" data-particles></div>
          <div class="spine">
            <span class="rule t1"></span><span class="rule t2"></span>
            <div class="emblem">
               <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="32" cy="32" r="20"/><path d="M32 10 L32 54 M10 32 L54 32"/><circle cx="32" cy="32" r="2.5" fill="currentColor"/></svg>
            </div>
            <span class="rule mid"></span>
            <div class="name">Data<br/>Case</div>
            <div class="explore-btn">
              <span class="explore-label">EXPLORE</span>
            </div>
            <span class="rule b1"></span><span class="rule b2"></span>
          </div>
        </a>

        <a class="book red" href="#" data-url="/warmth-archive"
           data-fact="Mobile, 3 months, 14.4k annual applications"
           data-text="Joint application matched to relation dynamics">
          <div class="particles" data-particles></div>
          <div class="spine">
            <span class="rule t1"></span><span class="rule t2"></span>
            <div class="emblem">
              <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M32 50 C18 40, 12 28, 18 20 C22 14, 30 14, 32 22 C34 14, 42 14, 46 20 C52 28, 46 40, 32 50 Z"/></svg>
            </div>
            <span class="rule mid"></span>
            <div class="name">Warmth<br/>Archive</div>
            <div class="explore-btn">
              <span class="explore-label">EXPLORE</span>
            </div>
            <span class="rule b1"></span><span class="rule b2"></span>
          </div>
        </a>

        <a class="book purple" href="#" data-url="/about-livia"
           data-fact="3 yrs experience"
           data-text="Love dancing and crafting">
          <div class="particles" data-particles></div>
          <div class="spine">
            <span class="rule t1"></span><span class="rule t2"></span>
            <div class="emblem">
              <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M32 8 L36 26 L54 28 L40 38 L46 56 L32 46 L18 56 L24 38 L10 28 L28 26 Z"/></svg>
            </div>
            <span class="rule mid"></span>
            <div class="name">About<br/>Livia</div>
            <div class="explore-btn">
              <span class="explore-label">EXPLORE</span>
            </div>
            <span class="rule b1"></span><span class="rule b2"></span>
          </div>
        </a>
      </nav>
    </main>
  </div>
</div>

<div id="data-overlay"></div>
<canvas id="data-canvas"></canvas>

<div id="fx-stage">
    <div id="fx-bloom" class="watercolor-bloom"></div>
</div>
<div id="final-wash"></div>

<!-- SVG Filter -->
<svg style="visibility: hidden; position: absolute;" width="0" height="0">
  <filter id="liquid-filter">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="40" />
    <feDisplacementMap in="SourceGraphic" scale="120" />
  </filter>
</svg>

<script>
const isMobile = 'ontouchstart' in window;
const dataCanvas = document.getElementById('data-canvas');
const dataOverlay = document.getElementById('data-overlay');
const fxBloom = document.getElementById('fx-bloom');
const wash = document.getElementById('final-wash');
const mainStage = document.getElementById('main-stage');

function buildSparkles() {
  document.querySelectorAll('[data-particles]').forEach(host => {
    host.innerHTML = '';
    const particleCount = 52; 
    for(let i=0; i < particleCount; i++){
      const s = document.createElement('span');
      s.className = 'spark dot';
      const angle = Math.random() * Math.PI * 2; 
      const distance = 40 + Math.random() * 95;
      const dx = Math.cos(angle) * distance;
      const dy = Math.sin(angle) * distance;
      s.style.setProperty('--dx', dx.toFixed(2) + 'px');
      s.style.setProperty('--dy', dy.toFixed(2) + 'px');
      const dur = (7 + Math.random() * 6);
      s.style.setProperty('--dur', dur + 's');
      s.style.setProperty('--delay', (Math.random() * -dur) + 's');
      host.appendChild(s);
    }
  });
}

function runDataTransition() {
    dataOverlay.classList.add('active'); 
    dataCanvas.style.display = 'block';
    const ctx = dataCanvas.getContext('2d');
    const w = dataCanvas.width = window.innerWidth;
    const h = dataCanvas.height = window.innerHeight;
    const count = isMobile ? 110 : 200; 
    const particles = [];
    for(let i=0; i<count; i++) {
        particles.push({
            angleOffset: i * 0.1375, 
            baseSize: 18 + Math.random() * 30, 
            char: "0123456789"[Math.floor(Math.random() * 10)],
            colorBase: Math.random() > 0.4 ? [192, 214, 223] : [6, 95, 130], 
            life: Math.random() 
        });
    }
    const startTime = performance.now();
    const duration = 3000; 
    function draw() {
        const now = performance.now();
        const progress = now - startTime;
        const ratio = progress / duration;
        ctx.fillStyle = `rgba(5, 5, 5, ${0.4 + (ratio * 0.5)})`; 
        ctx.fillRect(0, 0, w, h);
        const worldSpin = progress * (0.0007 + ratio * 0.005);
        const lensWobbleX = Math.sin(progress * 0.0008) * (w * 0.04) * (1 - ratio);
        const lensWobbleY = Math.cos(now * 0.0008) * (h * 0.04) * (1 - ratio);
        particles.forEach((p) => {
            p.life += 0.006 * (1 + ratio * 0.8); 
            if (p.life > 1) p.life = 0;
            const centrifugalVelocity = Math.pow(p.life, 1.7) * (Math.max(w,h) * 2.1);
            const currentAngle = p.angleOffset + worldSpin;
            const x = (w/2 + lensWobbleX) + Math.cos(currentAngle) * centrifugalVelocity;
            const y = (h/2 + lensWobbleY) + Math.sin(currentAngle) * centrifugalVelocity;
            const fade = Math.max(0, 1 - centrifugalVelocity / (Math.max(w,h) * 1.8)) * (1 - ratio);
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(currentAngle + Math.PI/2);
            ctx.fillStyle = `rgb(${p.colorBase[0]}, ${p.colorBase[1]}, ${p.colorBase[2]})`;
            ctx.globalAlpha = 0.2 + fade * 0.8;
            ctx.font = `bold ${p.baseSize * (0.2 + Math.pow(p.life, 1.5) * 8)}px 'Space Mono'`;
            ctx.fillText(p.char, 0, 0);
            ctx.restore();
        });
        if (progress < duration) {
            requestAnimationFrame(draw);
        } else {
            ctx.fillStyle = "#050505"; 
            ctx.fillRect(0, 0, w, h);
            setTimeout(() => { window.location.href = "data.html"; }, 100);
        }
    }
    draw();
}

function runWarmthTransition(e) {
    const x = e.clientX || window.innerWidth / 2;
    const y = e.clientY || window.innerHeight / 2;

    mainStage.classList.add('warm-transition');
    document.body.style.backgroundColor = 'var(--warmth-bg)';
    document.getElementById('book-archive-wrapper').style.opacity = '0';
    
    fxBloom.style.left = `${x}px`; 
    fxBloom.style.top = `${y}px`;
    fxBloom.classList.add('active');

    setTimeout(() => { 
        wash.classList.add('active'); 
    }, 2100);

    setTimeout(() => { 
        window.location.href = 'warmth.html'; 
    }, 2500);
}

const display = document.getElementById('summary-display');
const sumFact = document.getElementById('sum-fact');
const sumText = document.getElementById('sum-text');

function updateSummary(book) {
  if (book) {
    sumFact.textContent = book.dataset.fact;
    sumText.textContent = book.dataset.text;
    const bookRect = book.getBoundingClientRect();
    const displayRect = display.getBoundingClientRect();
    const connectorX = bookRect.left - displayRect.left;
    display.style.setProperty('--connector-x', `${connectorX}px`);
    display.classList.add('active');
  } else {
    display.classList.remove('active');
  }
}

document.querySelectorAll('.book').forEach(book => {
  book.addEventListener('mouseenter', () => { updateSummary(book); });
  book.addEventListener('mouseleave', () => { updateSummary(null); });
  
  book.addEventListener('click', (e) => {
    const clickedExplore = e.target.closest('.explore-btn');
    const isDataCase = book.classList.contains('blue');
    const isWarmthArchive = book.classList.contains('red');
    const isAboutLivia = book.classList.contains('purple');

    if (clickedExplore) {
      if (isDataCase) {
        runDataTransition();
        e.preventDefault();
      } else if (isWarmthArchive) {
        runWarmthTransition(e);
        e.preventDefault();
      } else if (isAboutLivia) {
        const label = clickedExplore.querySelector('.explore-label');
        label.innerHTML = 'Coming<br>soon';
        label.classList.add('plain');
        e.preventDefault();
      }
    }
  });
});

buildSparkles();
</script>
</body>
</html>
